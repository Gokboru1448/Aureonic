<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUREONIC | Admin Login</title>
    <style>
      :root { --bg:#f5f6f8; --panel:#fff; --line:#eceff3; --text:#101827; --text-soft:#59657a; --muted:#7f8ca3; --primary:#e50914; --primary-dark:#b20710; --primary-soft:#ff6b72; --primary-soft-2:#ffe5e7; --shadow:0 18px 40px rgba(17,24,39,.08); }
      *{box-sizing:border-box} body{margin:0;overflow-x:hidden;font-family:"Segoe UI", Tahoma,sans-serif;background:linear-gradient(135deg,#fff7f7,#f5f6f8 40%,#fff 100%);color:var(--text);display:grid;place-items:center;min-height:100vh;padding:20px}.login-box{width:min(100%,420px);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px}.brand-mark{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary-soft));color:#fff;font-weight:800;letter-spacing:.08em}.brand h2{margin:0;font-size:1.2rem;letter-spacing:.08em}.field{display:grid;gap:8px;margin-bottom:16px}.field label{font-size:.78rem;color:var(--text-soft);font-weight:600}.field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;outline:none}.options{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--text-soft);margin-bottom:18px}.remember{display:flex;align-items:center;gap:8px}.submit-btn{width:100%;height:46px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-soft));color:#fff;font-weight:700;cursor:pointer;box-shadow:0 12px 26px rgba(229,9,20,.22)}.note{margin-top:16px;text-align:center;font-size:.8rem;color:var(--text-soft)}.note a{color:var(--primary-dark);font-weight:700}
      @media(max-width:420px){body{padding:12px}.login-box{padding:22px 18px}}
    </style>
  </head>
  <body>
    <div class="login-box">
      <div class="brand"><div class="brand-mark">A</div><h2>AUREONIC ADMIN</h2></div>
      <form>
        <div class="field"><label>Email / Username</label><input type="text" placeholder="Enter email or username" /></div>
        <div class="field"><label>Password</label><input type="password" placeholder="Enter password" /></div>
        <div class="options">
          <label class="remember"><input type="checkbox" /> Remember Me</label>
          <a href="#" style="color: var(--primary-dark); text-decoration:none; font-weight:700;">Forgot Password?</a>
        </div>
        <button class="submit-btn" type="submit">Login</button>
        <div class="note">Need access? <a href="#">Contact support</a></div>
      </form>
    </div>
  </body>
</html>

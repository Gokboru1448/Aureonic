<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>AUREONIC | Login</title>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: #111111;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(227, 27, 35, 0.08),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(227, 27, 35, 0.07),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #f8f8f8 0%,
          #eeeeee 100%
        );

      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    a {
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }


    /* =========================================================
       BACKGROUND DECORATION
    ========================================================= */

    body::before,
    body::after {
      content: "";
      position: fixed;

      width: 220px;
      height: 220px;

      border-radius: 50%;

      background: rgba(227, 27, 35, 0.035);

      pointer-events: none;
      z-index: -1;

      animation: floatShape 8s ease-in-out infinite;
    }

    body::before {
      top: 4%;
      left: -90px;
    }

    body::after {
      right: -80px;
      bottom: 4%;

      animation-delay: -4s;
    }

    @keyframes floatShape {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-18px);
      }
    }


    /* =========================================================
       MAIN WRAPPER
    ========================================================= */

    .page-wrapper {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }


    /* =========================================================
       LOGIN CONTAINER
    ========================================================= */

    .login-container {
      width: min(1100px, 100%);

      min-height: 620px;
      max-height: 700px;

      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);

      overflow: hidden;

      background: rgba(255, 255, 255, 0.96);

      border: 1px solid rgba(255, 255, 255, 0.8);

      border-radius: 30px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.10),
        0 8px 25px rgba(0, 0, 0, 0.05);

      animation: containerAppear 0.6s ease both;
    }

    @keyframes containerAppear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }


    /* =========================================================
       FORM SIDE
    ========================================================= */

    .form-container {
      min-width: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 48px 52px;
    }

    .form-box {
      width: 100%;
      max-width: 390px;
    }


    /* =========================================================
       LOGO
    ========================================================= */

    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 145px;
      height: auto;

      margin: 0 auto 22px;

      filter:
        drop-shadow(0 7px 14px rgba(227, 27, 35, 0.15));
    }

    .logo-container h1 {
      font-size: clamp(28px, 3vw, 34px);

      line-height: 1.15;
      font-weight: 750;

      letter-spacing: -0.8px;

      color: #111111;

      margin-bottom: 9px;
    }

    .logo-container p {
      color: #6b7280;

      font-size: 14px;
      line-height: 1.6;
    }


    /* =========================================================
       FORM
    ========================================================= */

    .login-form {
      width: 100%;
    }

    .form-group {
      width: 100%;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;

      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 650;

      color: #202020;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .form-input {
      width: 100%;
      height: 50px;

      padding: 0 15px;

      border: 1px solid #dddddd;
      border-radius: 11px;

      outline: none;

      color: #111111;
      background: #ffffff;

      font-size: 14px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .form-input::placeholder {
      color: #a0a4aa;
    }

    .form-input:hover {
      border-color: #c9c9c9;
    }

    .form-input:focus {
      border-color: #e31b23;

      box-shadow:
        0 0 0 3px rgba(227, 27, 35, 0.09);

      background: #fff;
    }

    .password-input {
      padding-right: 50px;
    }

    .password-toggle {
      position: absolute;

      top: 50%;
      right: 13px;

      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      transform: translateY(-50%);

      cursor: pointer;

      background: transparent;

      color: #777777;

      border-radius: 7px;

      font-size: 17px;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .password-toggle:hover {
      background: #f5f5f5;
      color: #e31b23;
    }


    /* =========================================================
       OPTIONS
    ========================================================= */

    .form-options {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin: 4px 0 22px;
    }

    .remember-me {
      display: flex;
      align-items: center;

      min-width: 0;

      cursor: pointer;

      color: #6b7280;

      font-size: 12.5px;
      line-height: 1.4;
    }

    .remember-me input {
      width: 15px;
      height: 15px;

      flex: 0 0 auto;

      margin-right: 7px;

      accent-color: #e31b23;

      cursor: pointer;
    }

    .forgot-password {
      flex: 0 0 auto;

      color: #e31b23;

      font-size: 12.5px;
      font-weight: 600;

      transition: color 0.2s ease;
    }

    .forgot-password:hover {
      color: #b70e16;
      text-decoration: underline;
    }


    /* =========================================================
       LOGIN BUTTON
    ========================================================= */

    .login-button {
      width: 100%;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      cursor: pointer;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #e31b23 0%,
          #c9141b 100%
        );

      font-size: 14px;
      font-weight: 700;

      box-shadow:
        0 8px 20px rgba(227, 27, 35, 0.20);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .login-button:hover {
      transform: translateY(-1px);

      box-shadow:
        0 11px 25px rgba(227, 27, 35, 0.27);

      background:
        linear-gradient(
          135deg,
          #ee252d 0%,
          #c9141b 100%
        );
    }

    .login-button:active {
      transform: translateY(0);
    }


    /* =========================================================
       SIGN UP
    ========================================================= */

    .signup-text {
      text-align: center;

      margin-top: 21px;

      color: #777777;

      font-size: 13px;
      line-height: 1.5;
    }

    .signup-text a {
      color: #e31b23;
      font-weight: 700;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }


    /* =========================================================
       IMAGE SIDE
    ========================================================= */

    .image-container {
      position: relative;

      min-width: 0;
      min-height: 620px;

      overflow: hidden;

      background: #111111;
    }

    .image-container::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 1;

      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.06) 0%,
          rgba(0, 0, 0, 0.20) 45%,
          rgba(0, 0, 0, 0.72) 100%
        );
    }

    .image-container img {
      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      transition: transform 0.8s ease;
    }

    .login-container:hover .image-container img {
      transform: scale(1.025);
    }


    /* =========================================================
       IMAGE CONTENT
    ========================================================= */

    .image-content {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 2;

      padding: 48px 45px;
    }

    .image-content .small-title {
      display: inline-block;

      margin-bottom: 13px;

      color: #ffffff;

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 2px;
    }

    .image-content h2 {
      max-width: 480px;

      color: #ffffff;

      font-size: clamp(28px, 3.2vw, 43px);
      line-height: 1.08;

      letter-spacing: -1.1px;

      margin-bottom: 13px;
    }

    .image-content p {
      max-width: 450px;

      color: rgba(255, 255, 255, 0.82);

      font-size: 13.5px;
      line-height: 1.7;
    }


    /* =========================================================
       FLOATING CARD
    ========================================================= */

    .floating-card {
      position: absolute;

      top: 28px;
      right: 28px;

      z-index: 3;

      min-width: 165px;

      padding: 13px 15px;

      border:
        1px solid rgba(255, 255, 255, 0.18);

      border-radius: 13px;

      background:
        rgba(255, 255, 255, 0.13);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.15);

      color: #ffffff;
    }

    .floating-card strong {
      display: block;

      margin-bottom: 3px;

      font-size: 13px;
      font-weight: 750;
    }

    .floating-card span {
      display: block;

      color: rgba(255, 255, 255, 0.78);

      font-size: 10.5px;
    }


    /* =========================================================
       LARGE DESKTOP
    ========================================================= */

    @media (min-width: 1200px) {

      .login-container {
        width: min(1100px, calc(100vw - 48px));
      }

      .form-container {
        padding-left: 58px;
        padding-right: 58px;
      }

      .image-content {
        padding-left: 50px;
        padding-right: 50px;
      }
    }


    /* =========================================================
       DESKTOP / SMALL LAPTOP
    ========================================================= */

    @media (max-width: 1050px) {

      .page-wrapper {
        padding: 24px;
      }

      .login-container {
        min-height: 590px;

        grid-template-columns:
          minmax(0, 0.95fr)
          minmax(0, 1.05fr);
      }

      .form-container {
        padding: 40px;
      }

      .image-container {
        min-height: 590px;
      }

      .image-content {
        padding: 38px;
      }

      .floating-card {
        top: 22px;
        right: 22px;
      }
    }


    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 850px) {

      .page-wrapper {
        align-items: center;
        padding: 20px;
      }

      .login-container {
        max-height: none;
        min-height: 0;

        grid-template-columns: 1fr;

        border-radius: 24px;
      }

      .form-container {
        min-height: auto;

        padding:
          42px
          clamp(25px, 8vw, 70px);
      }

      .form-box {
        max-width: 420px;
      }

      .image-container {
        min-height: 430px;
        height: 430px;
      }

      .image-content {
        padding: 35px;
      }

      .image-content h2 {
        font-size: clamp(29px, 5vw, 40px);
      }
    }


    /* =========================================================
       MOBILE LARGE
    ========================================================= */

    @media (max-width: 600px) {

      body {
        background:
          radial-gradient(
            circle at 0% 0%,
            rgba(227, 27, 35, 0.07),
            transparent 35%
          ),
          #f5f5f5;
      }

      body::before,
      body::after {
        display: none;
      }

      .page-wrapper {
        min-height: 100svh;

        align-items: flex-start;

        padding:
          14px
          max(14px, env(safe-area-inset-right))
          14px
          max(14px, env(safe-area-inset-left));
      }

      .login-container {
        width: 100%;

        display: flex;
        flex-direction: column;

        border-radius: 20px;

        box-shadow:
          0 18px 45px rgba(0, 0, 0, 0.09);
      }

      .form-container {
        width: 100%;

        padding:
          32px
          clamp(18px, 7vw, 34px)
          30px;
      }

      .form-box {
        width: 100%;
        max-width: 100%;
      }

      .logo-container {
        margin-bottom: 25px;
      }

      .logo {
        width: 125px;
        margin-bottom: 17px;
      }

      .logo-container h1 {
        font-size: 27px;
        letter-spacing: -0.6px;
      }

      .logo-container p {
        font-size: 13px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-input {
        height: 49px;
        font-size: 14px;
      }

      .form-options {
        margin-top: 2px;
        margin-bottom: 19px;
      }

      .login-button {
        height: 49px;
      }

      .signup-text {
        margin-top: 18px;
        font-size: 12.5px;
      }

      .image-container {
        width: 100%;
        height: 310px;
        min-height: 310px;
      }

      .image-container img {
        object-position: center center;
      }

      .floating-card {
        top: 16px;
        right: 16px;

        min-width: 145px;

        padding: 10px 12px;

        border-radius: 11px;
      }

      .floating-card strong {
        font-size: 11.5px;
      }

      .floating-card span {
        font-size: 9.5px;
      }

      .image-content {
        padding: 25px 22px;
      }

      .image-content .small-title {
        margin-bottom: 9px;

        font-size: 9px;
        letter-spacing: 1.6px;
      }

      .image-content h2 {
        max-width: 360px;

        font-size: 27px;
        line-height: 1.1;

        letter-spacing: -0.7px;

        margin-bottom: 9px;
      }

      .image-content p {
        max-width: 370px;

        font-size: 11.5px;
        line-height: 1.55;
      }
    }


    /* =========================================================
       MOBILE SMALL
    ========================================================= */

    @media (max-width: 420px) {

      .page-wrapper {
        padding: 10px;
      }

      .login-container {
        border-radius: 17px;
      }

      .form-container {
        padding:
          27px
          18px
          25px;
      }

      .logo-container {
        margin-bottom: 22px;
      }

      .logo {
        width: 112px;
        margin-bottom: 14px;
      }

      .logo-container h1 {
        font-size: 25px;
      }

      .logo-container p {
        font-size: 12px;
      }

      .form-group label {
        font-size: 12px;
        margin-bottom: 7px;
      }

      .form-input {
        height: 47px;
        padding-left: 13px;
        padding-right: 13px;

        border-radius: 9px;

        font-size: 13px;
      }

      .password-input {
        padding-right: 46px;
      }

      .password-toggle {
        right: 9px;
      }

      .form-options {
        gap: 8px;
      }

      .remember-me,
      .forgot-password {
        font-size: 11px;
      }

      .remember-me input {
        width: 14px;
        height: 14px;

        margin-right: 5px;
      }

      .login-button {
        height: 47px;
        border-radius: 9px;

        font-size: 13px;
      }

      .signup-text {
        font-size: 11.5px;
      }

      .image-container {
        height: 275px;
        min-height: 275px;
      }

      .floating-card {
        top: 12px;
        right: 12px;

        min-width: 132px;

        padding: 8px 10px;
      }

      .floating-card strong {
        font-size: 10.5px;
      }

      .floating-card span {
        font-size: 8.5px;
      }

      .image-content {
        padding:
          20px
          17px;
      }

      .image-content .small-title {
        font-size: 8px;
        letter-spacing: 1.3px;
      }

      .image-content h2 {
        font-size: 23px;
      }

      .image-content p {
        font-size: 10.5px;
        line-height: 1.45;
      }
    }


    /* =========================================================
       VERY SMALL MOBILE - 320px
    ========================================================= */

    @media (max-width: 350px) {

      .page-wrapper {
        padding: 7px;
      }

      .login-container {
        border-radius: 15px;
      }

      .form-container {
        padding:
          24px
          14px
          22px;
      }

      .logo {
        width: 100px;
      }

      .logo-container h1 {
        font-size: 23px;
      }

      .logo-container p {
        font-size: 11px;
      }

      .form-options {
        align-items: flex-start;
      }

      .remember-me,
      .forgot-password {
        font-size: 10px;
      }

      .image-container {
        height: 250px;
        min-height: 250px;
      }

      .floating-card {
        display: none;
      }

      .image-content {
        padding: 18px 15px;
      }

      .image-content h2 {
        font-size: 21px;
      }

      .image-content p {
        font-size: 9.5px;
      }
    }


    /* =========================================================
       LANDSCAPE MOBILE
    ========================================================= */

    @media (max-height: 600px) and (orientation: landscape) {

      .page-wrapper {
        align-items: flex-start;

        padding: 12px;
      }

      .login-container {
        display: grid;

        grid-template-columns:
          minmax(0, 1fr)
          minmax(0, 1fr);

        min-height: 0;
      }

      .form-container {
        padding: 25px;
      }

      .logo-container {
        margin-bottom: 15px;
      }

      .logo {
        width: 85px;
        margin-bottom: 8px;
      }

      .logo-container h1 {
        font-size: 22px;
      }

      .logo-container p {
        font-size: 10px;
      }

      .form-group {
        margin-bottom: 10px;
      }

      .form-input,
      .login-button {
        height: 42px;
      }

      .form-options {
        margin-bottom: 12px;
      }

      .signup-text {
        margin-top: 10px;
      }

      .image-container {
        min-height: 500px;
        height: auto;
      }

      .image-content {
        padding: 22px;
      }

      .image-content h2 {
        font-size: 26px;
      }

      .image-content p {
        font-size: 10px;
      }
    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>


<body>

  <main class="page-wrapper">

    <section class="login-container">

      <!-- =====================================================
           LOGIN FORM
      ====================================================== -->

      <div class="form-container">

        <div class="form-box">

          <div class="logo-container">

            <img
              src="assets/logo.png"
              alt="AUREONIC"
              class="logo"
            />

            <h1>Welcome Back</h1>

            <p>
              Sign in to continue to your AUREONIC account.
            </p>

          </div>


          <form
            class="login-form"
            action="#"
            method="post"
          >

            <!-- Email -->

            <div class="form-group">

              <label for="email">
                Email Address
              </label>

              <div class="input-wrapper">

                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-input"
                  placeholder="Enter your email"
                  autocomplete="email"
                  required
                />

              </div>

            </div>


            <!-- Password -->

            <div class="form-group">

              <label for="password">
                Password
              </label>

              <div class="input-wrapper">

                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-input password-input"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />

                <button
                  type="button"
                  class="password-toggle"
                  id="passwordToggle"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  👁
                </button>

              </div>

            </div>


            <!-- Options -->

            <div class="form-options">

              <label class="remember-me">

                <input
                  type="checkbox"
                  name="remember"
                />

                <span>
                  Remember me
                </span>

              </label>


              <a
                href="#"
                class="forgot-password"
              >
                Forgot Password?
              </a>

            </div>


            <!-- Login -->

            <button
              type="submit"
              class="login-button"
            >
              Login
            </button>


            <!-- Signup -->

            <p class="signup-text">

              Don't have an account?

              <a href="signup.html">
                Create Account
              </a>

            </p>

          </form>

        </div>

      </div>


      <!-- =====================================================
           IMAGE SIDE
      ====================================================== -->

      <div class="image-container">

        <img
          src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=1200&q=85"
          alt="Premium AUREONIC audio headphones"
          loading="eager"
        />


        <!-- Floating Card -->

        <div class="floating-card">

          <strong>
            Premium Sound
          </strong>

          <span>
            AUREONIC Audio
          </span>

        </div>


        <!-- Image Content -->

        <div class="image-content">

          <span class="small-title">
            AUREONIC PREMIUM AUDIO
          </span>

          <h2>
            Your Premium Sound Experience.
          </h2>

          <p>
            Discover immersive sound, premium design,
            and technology crafted for the way you listen.
          </p>

        </div>

      </div>

    </section>

  </main>


  <script>
    /* =========================================================
       PASSWORD TOGGLE
    ========================================================= */

    const passwordInput =
      document.getElementById("password");

    const passwordToggle =
      document.getElementById("passwordToggle");


    passwordToggle.addEventListener("click", () => {

      const isPassword =
        passwordInput.type === "password";


      passwordInput.type =
        isPassword ? "text" : "password";


      passwordToggle.textContent =
        isPassword ? "🙈" : "👁";


      passwordToggle.setAttribute(
        "aria-label",
        isPassword
          ? "Hide password"
          : "Show password"
      );


      passwordToggle.setAttribute(
        "aria-pressed",
        isPassword ? "true" : "false"
      );

    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splash Screen</title>
    <style>
      :root {
        --bg-light: #f5f5f5;
        --bg-soft: #fff7f7;
        --white: #ffffff;
        --soft-white: #f0f2f5;
        --silver: #c0c4ca;
        --silver-deep: #8b919a;
        --red: #e31b23;
        --red-soft: #ff5d5d;
        --red-deep: #b70e16;
        --shadow: rgba(227, 27, 35, 0.15);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at 50% 30%, rgba(255, 90, 90, 0.18), transparent 18%),
          linear-gradient(135deg, #ffffff 0%, #f8f8f8 38%, #f3f3f3 100%);
        overflow: hidden;
      }

      body {
        position: relative;
      }

      .splash-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(4px);
        z-index: 50;
        transition: opacity 0.9s ease, visibility 0.9s ease;
      }

      .splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .logo-stage {
        position: relative;
        width: min(72vw, 500px);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: logoFloat 3s ease-in-out infinite;
      }

      .logo-stage::before {
        content: "";
        position: absolute;
        width: 210%;
        height: 210%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(227, 27, 35, 0.38) 0%, rgba(227, 27, 35, 0.18) 22%, rgba(227, 27, 35, 0.08) 42%, rgba(255, 255, 255, 0) 72%);
        filter: blur(24px);
        transform: translateY(10px);
      }

      .logo-mark {
        position: relative;
        width: 100%;
        max-width: 440px;
        z-index: 2;
        filter: drop-shadow(0 8px 22px rgba(183, 14, 22, 0.18));
        animation: logoReveal 1.4s ease-out both;
      }

      .logo-mark img {
        width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9));
      }

      @keyframes logoReveal {
        0% {
          opacity: 0;
          transform: scale(0.9) translateY(24px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes logoFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @media (max-width: 640px) {
        .logo-stage {
          width: min(80vw, 380px);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-screen" id="splashScreen">
      <div class="logo-stage" aria-label="Brand splash logo">
        <div class="logo-mark">
          <img src="assets/logo.png" alt="Logo" />
        </div>
      </div>
    </div>

    <script>
      const splashScreen = document.getElementById('splashScreen');

      window.addEventListener('load', () => {
        setTimeout(() => {
          splashScreen.classList.add('hidden');
          setTimeout(() => {
            window.location.href = 'home.html';
          }, 700);
        }, 5000);
      });
    </script>
  </body>
</html>

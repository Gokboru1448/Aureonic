```html
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Splash Screen</title>

    <style>
      :root {
        --white: #ffffff;
        --red: #e31b23;
        --red-deep: #b70e16;
      }

      /* ================================
         RESET
      ================================= */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow-x: hidden;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 50% 30%,
            rgba(255, 90, 90, 0.18) 0%,
            rgba(255, 90, 90, 0) 22%
          ),
          linear-gradient(
            135deg,
            #ffffff 0%,
            #f8f8f8 38%,
            #f3f3f3 100%
          );
      }

      /* ================================
         SPLASH SCREEN
      ================================= */

      .splash-screen {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;
        min-height: 100dvh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding:
          max(20px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));

        background: rgba(255, 255, 255, 0.8);

        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);

        z-index: 50;

        opacity: 1;
        visibility: visible;

        transition:
          opacity 0.9s ease,
          visibility 0.9s ease;
      }

      .splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ================================
         LOGO STAGE
      ================================= */

      .logo-stage {
        position: relative;

        width: min(72vw, 500px);

        /*
          Prevent logo from becoming too large
          on very short screens.
        */
        max-width: 500px;

        display: flex;
        align-items: center;
        justify-content: center;

        animation: logoFloat 3s ease-in-out infinite;
      }

      /* ================================
         LOGO GLOW
      ================================= */

      .logo-stage::before {
        content: "";

        position: absolute;

        width: 210%;
        height: 210%;

        border-radius: 50%;

        background:
          radial-gradient(
            circle,
            rgba(227, 27, 35, 0.38) 0%,
            rgba(227, 27, 35, 0.18) 22%,
            rgba(227, 27, 35, 0.08) 42%,
            rgba(255, 255, 255, 0) 72%
          );

        filter: blur(24px);

        transform: translateY(10px);

        pointer-events: none;
      }

      /* ================================
         LOGO
      ================================= */

      .logo-mark {
        position: relative;

        width: 100%;
        max-width: 440px;

        z-index: 2;

        filter:
          drop-shadow(
            0 8px 22px rgba(183, 14, 22, 0.18)
          );

        animation: logoReveal 1.4s ease-out both;
      }

      .logo-mark img {
        display: block;

        width: 100%;
        height: auto;

        max-width: 100%;

        object-fit: contain;

        filter:
          drop-shadow(
            0 0 12px rgba(255, 255, 255, 0.9)
          );
      }

      /* ================================
         LOGO ANIMATIONS
      ================================= */

      @keyframes logoReveal {
        0% {
          opacity: 0;
          transform: scale(0.9) translateY(24px);
        }

        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes logoFloat {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-8px);
        }
      }

      /* ================================
         SMALL MOBILE
         Up to 360px
      ================================= */

      @media (max-width: 360px) {
        .splash-screen {
          padding-left: 16px;
          padding-right: 16px;
        }

        .logo-stage {
          width: 86vw;
        }

        .logo-mark {
          max-width: 320px;
        }

        .logo-stage::before {
          width: 190%;
          height: 190%;
          filter: blur(20px);
        }
      }

      /* ================================
         MOBILE
         361px - 600px
      ================================= */

      @media (min-width: 361px) and (max-width: 600px) {
        .logo-stage {
          width: 82vw;
        }

        .logo-mark {
          max-width: 380px;
        }
      }

      /* ================================
         TABLET PORTRAIT
         601px - 900px
      ================================= */

      @media (min-width: 601px) and (max-width: 900px) {
        .logo-stage {
          width: min(70vw, 450px);
        }

        .logo-mark {
          max-width: 420px;
        }
      }

      /* ================================
         TABLET / SMALL LAPTOP LANDSCAPE
         Prevent oversized logo on short screens
      ================================= */

      @media (orientation: landscape) and (max-height: 600px) {
        .splash-screen {
          padding-top: 15px;
          padding-bottom: 15px;
        }

        .logo-stage {
          /*
            Height-based sizing is important
            for landscape mobile/tablet.
          */
          width: min(55vw, 400px);
          max-height: 80dvh;
        }

        .logo-mark {
          max-width: 400px;
          max-height: 75dvh;
        }

        .logo-mark img {
          max-height: 75dvh;
          width: auto;
          max-width: 100%;
        }

        .logo-stage::before {
          width: 190%;
          height: 190%;
        }
      }

      /* ================================
         LARGE DESKTOP
         1200px+
      ================================= */

      @media (min-width: 1200px) {
        .logo-stage {
          width: min(42vw, 520px);
        }

        .logo-mark {
          max-width: 480px;
        }
      }

      /* ================================
         VERY LARGE SCREENS
      ================================= */

      @media (min-width: 1600px) {
        .logo-stage {
          width: min(36vw, 560px);
        }

        .logo-mark {
          max-width: 520px;
        }
      }

      /* ================================
         REDUCED MOTION
         Accessibility
      ================================= */

      @media (prefers-reduced-motion: reduce) {
        .logo-stage,
        .logo-mark {
          animation: none;
        }

        .splash-screen {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div
      class="splash-screen"
      id="splashScreen"
      aria-label="Splash screen"
    >
      <div
        class="logo-stage"
        aria-label="Brand splash logo"
      >
        <div class="logo-mark">
          <img
            src="assets/logo.png"
            alt="Logo"
          />
        </div>
      </div>
    </div>

    <script>
      const splashScreen =
        document.getElementById("splashScreen");

      window.addEventListener("load", () => {
        setTimeout(() => {
          splashScreen.classList.add("hidden");

          setTimeout(() => {
            window.location.href = "home.html";
          }, 700);
        }, 5000);
      });
    </script>
  </body>
</html>
